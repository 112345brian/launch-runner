name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (editable, so the tools and subprocess tests import the packages)
        run: >
          python -m pip install --upgrade pip pytest import-linter ruff setuptools
          -e distributions/commandport -e distributions/proclaunch -e distributions/lifecycle-runner
          -e distributions/ensure-running
      - name: Lint
        run: ruff check .
      - name: Import contracts
        run: lint-imports
      - name: No raw process calls outside the adapters
        run: python -m commandport.scan
      - name: Tests (includes building and installing the wheels)
        run: python -m pytest
