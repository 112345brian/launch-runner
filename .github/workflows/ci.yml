name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install --upgrade pip pytest psutil import-linter ruff setuptools
      - name: Lint
        run: ruff check .
      - name: Import contracts
        run: lint-imports
      - name: No raw process calls outside the adapters
        run: python -m commandport.scan
      - name: Tests (includes building and installing the wheels)
        run: python -m pytest
