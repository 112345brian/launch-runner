# Development tooling for the repository. The published distributions are described under distributions/;
# there is deliberately no [project] table here.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "distributions/commandport/src", "distributions/proclaunch/src", "distributions/lifecycle-runner/src",
    "distributions/ensure-running/src",
]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E9", "E711", "E712", "E713", "E714", "E721", "E722"]

# This repository dogfoods the contract it publishes: a process may only be started by an adapter.
[tool.commandport]
source_roots = [
    "distributions/commandport/src", "distributions/proclaunch/src", "distributions/lifecycle-runner/src",
    "distributions/ensure-running/src",
]
allow = ["lifecycle_runner.adapters", "proclaunch.adapters"]
exclude_dirs = ["tests"]

[tool.importlinter]
root_packages = ["commandport", "proclaunch", "lifecycle_runner", "ensure_running"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "commandport checks the libraries from outside: it imports none of them"
type = "forbidden"
source_modules = ["commandport"]
forbidden_modules = ["lifecycle_runner", "proclaunch", "ensure_running", "psutil"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "proclaunch core must not import adapters or process/file/network modules"
type = "forbidden"
source_modules = ["proclaunch.domain", "proclaunch.ports", "proclaunch.launching", "proclaunch.services", "proclaunch.readiness"]
forbidden_modules = ["proclaunch.adapters", "subprocess", "psutil", "socket", "urllib", "tempfile", "shutil"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "proclaunch adapters must not import application logic or the composition root"
type = "forbidden"
source_modules = ["proclaunch.adapters"]
forbidden_modules = ["proclaunch.api", "proclaunch.launching", "proclaunch.services", "proclaunch.readiness"]

[[tool.importlinter.contracts]]
name = "lifecycle_runner core must not import adapters or process/file/network modules"
type = "forbidden"
source_modules = ["lifecycle_runner.ports", "lifecycle_runner.runner", "lifecycle_runner.capture"]
forbidden_modules = ["lifecycle_runner.adapters", "subprocess", "psutil", "socket", "urllib", "tempfile", "shutil"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "lifecycle_runner is independent of proclaunch"
type = "forbidden"
source_modules = ["lifecycle_runner"]
forbidden_modules = ["proclaunch"]

[[tool.importlinter.contracts]]
name = "lifecycle_runner adapters must not import the runner or the composition root"
type = "forbidden"
source_modules = ["lifecycle_runner.adapters"]
forbidden_modules = ["lifecycle_runner.api", "lifecycle_runner.runner"]

[[tool.importlinter.contracts]]
name = "ensure_running core must not import a sibling library or an I/O module"
type = "forbidden"
source_modules = ["ensure_running.domain", "ensure_running.reconciler"]
forbidden_modules = [
    "proclaunch", "lifecycle_runner", "commandport", "psutil", "subprocess", "socket", "urllib", "tempfile", "shutil",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "ensure_running adapters must not import the reconciler or the composition roots"
type = "forbidden"
source_modules = ["ensure_running.conditions", "ensure_running.config", "ensure_running.history", "ensure_running.lifecycle_check"]
forbidden_modules = ["ensure_running.reconciler", "ensure_running.api", "ensure_running.cli"]

[[tool.importlinter.contracts]]
name = "vendored helpers import nothing from the family"
type = "forbidden"
source_modules = ["lifecycle_runner._vendor", "proclaunch._vendor"]
forbidden_modules = ["commandport", "proclaunch", "lifecycle_runner", "ensure_running"]
allow_indirect_imports = true
