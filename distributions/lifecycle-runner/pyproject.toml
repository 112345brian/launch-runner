[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lifecycle-runner"
version = "0.2.0"
description = "Run a command to completion with a time limit: capture it, stream it, or log it (explicit results, never raises)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Brian Powers" }]
keywords = [
    "subprocess",
    "process",
    "timeout",
    "windows",
    "console",
    "capture",
    "stream",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "psutil>=5.9",
]

[project.urls]
Homepage = "https://github.com/112345brian/launch-runner"
Repository = "https://github.com/112345brian/launch-runner"
Issues = "https://github.com/112345brian/launch-runner/issues"

[tool.setuptools]
packages = ["lifecycle_runner", "lifecycle_runner.adapters", "lifecycle_runner._vendor"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
lifecycle_runner = ["py.typed"]
