[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "commandport"
version = "0.2.0"
description = "A pure contract for running commands and background processes, plus a scan that enforces it."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Brian Powers" }]
keywords = [
    "subprocess",
    "process",
    "ports-and-adapters",
    "onion-architecture",
    "architecture",
    "lint",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
]

[project.urls]
Homepage = "https://github.com/112345brian/launch-runner"
Repository = "https://github.com/112345brian/launch-runner"
Issues = "https://github.com/112345brian/launch-runner/issues"

[tool.setuptools]
packages = ["commandport"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
commandport = ["py.typed"]
